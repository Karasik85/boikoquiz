:root{
  --paper:#FBF4F5; --surface:#FFFFFF; --ink:#2A1620; --soft:#6E4F5B;
  --berry:#8E2C4F; --rose:#E7C3CD; --gold:#B8912A; --line:#EBD6DC;
  --on-berry:#FFFFFF; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#1C1116; --surface:#27181F; --ink:#F6E7EC; --soft:#C9A9B5;
    --berry:#E48DAB; --rose:#5A3343; --gold:#DDBB62; --line:#3E2731;

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 Manrope,system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:28px 20px 64px}
header{display:flex;gap:18px;align-items:center;margin-bottom:22px}
.gem{width:74px;height:74px;flex:none}
.gem polygon{stroke:var(--gold);stroke-width:1.2;fill:transparent;transition:fill .35s}
.gem polygon.on{fill:var(--berry)}
.brand{font:600 34px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.06em;margin:0}
.by{color:var(--soft);font-size:14px;margin:6px 0 0}
nav{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:26px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--soft);font:500 15px Manrope,sans-serif;padding:10px 12px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--berry);border-color:var(--berry)}
h2{font:600 32px/1.15 "Cormorant Garamond",Georgia,serif;margin:0 0 10px}
h3{font:600 23px/1.25 "Cormorant Garamond",Georgia,serif;margin:28px 0 8px}
p{margin:0 0 14px}
.lead{color:var(--soft)}
.count{color:var(--soft);font-size:14px;margin-bottom:8px}
.q{font:500 24px/1.3 "Cormorant Garamond",Georgia,serif;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font:400 16px/1.45 Manrope,sans-serif;cursor:pointer}
.opt:hover{border-color:var(--berry)}
.scale{grid-template-columns:repeat(2,1fr)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{display:inline-block;background:var(--berry);color:var(--on-berry);border:0;border-radius:999px;padding:13px 22px;font:700 15px Manrope,sans-serif;text-decoration:none;cursor:pointer}
.ghost{background:none;color:var(--berry);border:1px solid var(--berry)}
.link{background:none;border:0;color:var(--soft);font:500 14px Manrope,sans-serif;cursor:pointer;padding:6px 0;text-decoration:underline}
.result{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:4px 14px 14px 4px;padding:22px 20px}
.tag{color:var(--gold);font-weight:700;font-size:14px;margin-bottom:4px}
.bars{display:grid;gap:10px;margin:16px 0}
.bar span{display:block;font-size:14px;color:var(--soft);margin-bottom:4px}
.track{height:8px;background:var(--rose);border-radius:8px;overflow:hidden}
.fill{height:100%;background:var(--berry)}
.step{color:var(--berry);font-weight:500}
.note{font-size:14px;color:var(--soft);border-top:1px solid var(--line);padding-top:12px;margin-top:16px}
table{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0 6px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--soft);font-weight:500;font-size:14px}
td:last-child{color:var(--berry);font-weight:500}
ol.days{padding:0;list-style:none;margin:10px 0}
ol.days li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
ol.days input{width:22px;height:22px;margin-top:3px;accent-color:var(--berry);flex:none}
ol.days b{display:block}
.quote{font:italic 500 22px/1.4 "Cormorant Garamond",Georgia,serif;color:var(--berry);margin:0 0 18px}
.gate{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px}
.gate label{display:block;font-size:14px;color:var(--soft);margin:14px 0 6px}
.gate input[type=text]{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:400 16px Manrope,sans-serif}
.gate .agree{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--soft);margin:16px 0 4px}
.gate .agree input{accent-color:var(--berry);width:18px;height:18px;margin-top:2px;flex:none}
.err{color:var(--berry);font-size:14px;min-height:20px;margin:6px 0 0}
.ritual{display:grid;gap:12px;margin:10px 0}
.ritual div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.ritual b{color:var(--berry)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:420px){.scale{grid-template-columns:1fr}h2{font-size:28px}}
</style>

  const head = {quiz:"Твій результат готовий", test:"Твій результат готовий", guide:"Гайд «Щоденні кроки»"}[kind];
  const sub = kind==="guide"
    ? "Залиш свій Telegram, і гайд відкриється. Людмила напише тобі особисто з першим кроком."
    : "Залиш свій Telegram, щоб побачити результат. Людмила напише тобі особисто з порадою саме для твого рівня.";
  return `<form class="gate" data-gate="${kind}" novalidate>
    <h2>${head}</h2><p class="lead">${sub}</p>
    <label for="g-name">Як до тебе звертатися</label>
    <input id="g-name" type="text" autocomplete="given-name" placeholder="Ім'я">
    <label for="g-tg">Твій нік у Telegram</label>
    <input id="g-tg" type="text" autocomplete="off" placeholder="@nickname" inputmode="text">
    <label class="agree"><input id="g-ok" type="checkbox"> Погоджуюсь, що Людмила Бойко може написати мені в Telegram</label>
    <p class="err" id="g-err" role="alert"></p>
    <button class="btn" type="submit">${kind==="guide"?"Відкрити гайд":"Показати результат"}</button>
  </form>`;
}

function summary(){
  const {tab,ans} = state;
  if(tab==="guide") return {tool:"Гайд «Щоденні кроки»", score:"", result:""};
  const isQuiz = tab==="quiz", sum = ans.reduce((a,b)=>a+b,0);
  const res = (isQuiz?QUIZ_RES:TEST_RES).find(r=>sum<=r.max);
  return {tool: isQuiz?"Квіз «Чи готова ти до змін»":"Тест на вигорання", score:`${sum} з ${isQuiz?24:36}`, result:res.tag};
}

function sendLead(extra){
  const data = Object.assign({}, lead, summary(), extra||{}, {page: location.href, at: new Date().toISOString()});
  if(!LEAD_ENDPOINT) { console.info("LEAD (endpoint не налаштований):", data); return; }
  fetch(LEAD_ENDPOINT, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(data)}).catch(()=>{});
}

function render(){
  const {tab,i,ans} = state;
  if(tab==="guide"){
    if(!lead){ app.innerHTML = gateHTML("guide"); setGem(0); return; }
    app.innerHTML = GUIDE; setGem(1); return;
  }
  const isQuiz = tab==="quiz", data = isQuiz ? QUIZ : TEST;
  setGem(ans.length / data.length);
  if(!state.started){
    app.innerHTML = isQuiz
      ? `<h2>Чи готова ти до змін?</h2><p class="lead">8 запитань, 2 хвилини. Відповідай чесно, як є зараз, а не як «правильно». У кінці отримаєш свій результат і перший крок.</p><button class="btn" data-start>Почати</button>`
      : `<h2>Тест на вигорання</h2><p class="lead">12 тверджень про останній місяць. Обери, як часто це з тобою буває. Тест покаже рівень виснаження і сферу, де енергія витікає найбільше.</p><button class="btn" data-start>Почати тест</button>`;
    return;
  }
  if(i < data.length){
    const opts = isQuiz ? data[i].a : SCALE;
    const qText = isQuiz ? data[i].q : data[i][0];
    app.innerHTML = `<p class="count">Питання ${i+1} з ${data.length}</p>
      <p class="q">${qText}</p>
      <div class="opts ${isQuiz?"":"scale"}">${opts.map(([t,v])=>`<button class="opt" data-v="${v}">${t}</button>`).join("")}</div>
      ${i?'<button class="link" data-back>Назад</button>':""}`;
    return;
  }
  if(!lead){ app.innerHTML = gateHTML(tab); return; }
  if(!state.sent){ sendLead(); state.sent = true; }
  const sum = ans.reduce((a,b)=>a+b,0);
  const res = (isQuiz?QUIZ_RES:TEST_RES).find(r=>sum<=r.max);
  let bars = "";
  if(!isQuiz){
    bars = `<div class="bars">${BLOCKS.map((b,k)=>{
      const s = ans.filter((_,j)=>TEST[j][1]===k).reduce((a,c)=>a+c,0);
      return `<div class="bar"><span>${b}: ${s} з 12</span><div class="track"><div class="fill" style="width:${s/12*100}%"></div></div></div>`;
    }).join("")}</div>`;
  }
  app.innerHTML = `<div class="result">
    <p class="tag">${res.tag} · ${sum} з ${isQuiz?24:36}</p>
    <h2>${res.title}</h2><p>${res.text}</p>${bars}<p class="step">${res.step}</p>
    <div class="row">${cta(res.cta.some(([,url]) => url === LINKS.tg) ? res.cta : [...res.cta, ["Підписатися на канал Людмили", LINKS.tg]])}</div>
    ${isQuiz?"":'<p class="note">Тест не є медичною діагностикою. Він допомагає помітити свій стан і вчасно подбати про себе.</p>'}
  </div><button class="link" data-restart>Пройти ще раз</button>`;
}

function go(tab){
  state = {tab, i:0, ans:[], started:false, sent:false};
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected", b.dataset.tab===tab));
  render(); window.scrollTo(0,0);
}

document.addEventListener("click", e=>{
  const t = e.target.closest("button,a"); if(!t || t.closest("[data-gate]")) return;
  if(t.dataset.tab) return go(t.dataset.tab);
  if(t.dataset.go){ e.preventDefault(); return go(t.dataset.go); }
  if(t.hasAttribute("data-start")){ state.started=true; state.i=0; state.ans=[]; state.sent=false; }
  if(t.dataset.v!==undefined){ state.ans[state.i]=+t.dataset.v; state.ans.length=state.i+1; state.i++; }
  if(t.dataset.v!==undefined) state.sent=false;
  if(t.hasAttribute("data-back")){ state.i--; state.ans.length=state.i; }
  if(t.hasAttribute("data-restart")) return go(state.tab);
  render();
});
document.addEventListener("submit", e=>{
  const f = e.target.closest("[data-gate]"); if(!f) return;
  e.preventDefault();
  const name = f.querySelector("#g-name").value.trim();
  let tg = f.querySelector("#g-tg").value.trim().replace(/^https?:\/\/t\.me\//i,"").replace(/^@/,"");
  const err = f.querySelector("#g-err");
  if(!name) return err.textContent = "Напиши, як до тебе звертатися.";
  if(!/^[A-Za-z0-9_]{5,32}$/.test(tg)) return err.textContent = "Нік у Telegram має бути латиницею, від 5 символів, наприклад @olena_k.";
  if(!f.querySelector("#g-ok").checked) return err.textContent = "Постав галочку, щоб Людмила могла тобі написати.";
  lead = {name, telegram:"@"+tg};
  try { localStorage.setItem("ogranka_lead", JSON.stringify(lead)); } catch(e) {}
  if(state.tab==="guide") sendLead();
  render(); window.scrollTo(0,0);
});
render();
</script>
</body>
</html>
